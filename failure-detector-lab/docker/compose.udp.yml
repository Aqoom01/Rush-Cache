name: openkache-fd-udp

x-node: &node
  build:
    context: ..
    dockerfile: docker/Dockerfile.udp
  image: openkache-fd-udp:local
  environment: &node-environment
    FD_PROFILE: ${FD_PROFILE:-swim-base}
    FD_PORT: "19000"
    FD_DURATION_SECONDS: ${FD_DURATION_SECONDS:-15}
    FD_PEERS: "${FD_PEERS:-0=node0:19000,1=node1:19000,2=node2:19000}"
  networks:
    - fd-lab

services:
  node0:
    <<: *node
    environment:
      <<: *node-environment
      FD_NODE_ID: "0"

  node1:
    <<: *node
    environment:
      <<: *node-environment
      FD_NODE_ID: "1"
    cap_add:
      - NET_ADMIN

  node2:
    <<: *node
    environment:
      <<: *node-environment
      FD_NODE_ID: "2"

  node3:
    <<: *node
    environment:
      <<: *node-environment
      FD_NODE_ID: "3"

  node4:
    <<: *node
    environment:
      <<: *node-environment
      FD_NODE_ID: "4"

  node5:
    <<: *node
    environment:
      <<: *node-environment
      FD_NODE_ID: "5"

  node6:
    <<: *node
    environment:
      <<: *node-environment
      FD_NODE_ID: "6"

  node7:
    <<: *node
    environment:
      <<: *node-environment
      FD_NODE_ID: "7"

networks:
  fd-lab:
    internal: true
