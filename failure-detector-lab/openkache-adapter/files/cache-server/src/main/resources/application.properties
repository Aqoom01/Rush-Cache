# Default configuration for local development. A configuration file passed at startup overrides this file.
node.id=1
cluster.id=openkache-local
# Bind address for the client/peer TCP listeners and the SWIM UDP listener.
bind.host=127.0.0.1
# Bind address for the /metrics endpoint.
admin.host=127.0.0.1
client.port=7000
peer.port=7001
admin.port=9091
workers=2
request.timeout.ms=2000
# Static members and SWIM UDP destinations: comma-separated nodeId@host:peerPort entries.
cluster.members=1@127.0.0.1:7001
swim.probe-interval.ms=500
swim.direct-timeout.ms=100
swim.indirect-timeout.ms=100
swim.suspicion-timeout.ms=1500
swim.indirect-checks=3
swim.gossip-retransmit-multiplier=3
swim.max-piggyback-updates=8
