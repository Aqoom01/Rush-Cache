<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
  <title id="title">파라미터별 속도와 안정성 트레이드오프</title>
  <desc id="desc">Phi threshold와 SWIM profile별 크래시 감지 지연과 15초 파티션 오탐 결과</desc>
  <rect width="960" height="610" fill="#ffffff"/>
  <text x="56" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033">파라미터별 속도–안정성 트레이드오프</text>
  <text x="56" y="77" font-family="Arial, sans-serif" font-size="15" fill="#596579">5-node 기준 · Crash DEAD 지연과 15초 partition 오탐 비교</text>
  <text x="56" y="122" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#344054">Phi Accrual + Gossip</text>
  <line x1="116" y1="340" x2="885" y2="340" stroke="#9aa5b5" stroke-width="1.5"/>
  <line x1="116" y1="150" x2="116" y2="340" stroke="#9aa5b5" stroke-width="1.5"/>
  <g stroke="#e5e9f0"><line x1="116" y1="290" x2="885" y2="290"/><line x1="116" y1="240" x2="885" y2="240"/><line x1="116" y1="190" x2="885" y2="190"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667085"><text x="98" y="344">0s</text><text x="98" y="294">2s</text><text x="98" y="244">4s</text><text x="98" y="194">6s</text><text x="108" y="363">0</text><text x="258" y="363">5</text><text x="408" y="363">10</text><text x="558" y="363">15</text><text x="708" y="363">20</text><text x="858" y="363">25s</text></g>
  <polyline points="382,188 531,310 677,340 824,340" fill="none" stroke="#f59e42" stroke-width="3"/>
  <g fill="#f59e42" stroke="#fff" stroke-width="3"><circle cx="382" cy="188" r="10"/><circle cx="531" cy="310" r="10"/><circle cx="677" cy="340" r="10"/><circle cx="824" cy="340" r="10"/></g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5410"><text x="348" y="172">t4 · 8.8s / 6.1s</text><text x="494" y="294">t6 · 13.7s / 1.2s</text><text x="640" y="324">t8 · 18.5s / 0s</text><text x="775" y="324">t10 · 23.3s / 0s</text></g>
  <text x="500" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#667085">X: Crash DEAD 지연 · Y: partition false DEAD 지속시간</text>
  <text x="56" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#344054">SWIM + Lifeguard</text>
  <g font-family="Arial, sans-serif">
    <rect x="104" y="456" width="232" height="105" rx="10" fill="#edf4ff"/><text x="220" y="484" text-anchor="middle" font-size="16" font-weight="700" fill="#245bb5">fast</text><text x="220" y="513" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Crash 7.2s</text><text x="220" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#b42318">partition false DEAD 발생</text>
    <rect x="364" y="456" width="232" height="105" rx="10" fill="#edf4ff"/><text x="480" y="484" text-anchor="middle" font-size="16" font-weight="700" fill="#245bb5">balanced</text><text x="480" y="513" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Crash 14.4s</text><text x="480" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#b42318">false DEAD 5.6s</text>
    <rect x="624" y="456" width="232" height="105" rx="10" fill="#edf4ff"/><text x="740" y="484" text-anchor="middle" font-size="16" font-weight="700" fill="#245bb5">conservative</text><text x="740" y="513" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Crash 21.6s</text><text x="740" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#027a48">partition false DEAD 없음</text>
  </g>
  <text x="56" y="592" font-family="Arial, sans-serif" font-size="12" fill="#667085">주의: conservative는 100-node crash-under-jitter에서 관측 구간 내 미검출이 발생했다.</text>
</svg>
