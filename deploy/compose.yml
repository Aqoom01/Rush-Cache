# 로컬 실행: server + Prometheus + Grafana
#   docker compose -f deploy/compose.yml up --build
# 모든 공개 포트는 127.0.0.1에만 bind한다. server의 /metrics(9091)는 호스트에 공개하지 않고
# compose 내부 네트워크에서 Prometheus만 접근한다.
name: openkache

services:
  server:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    image: openkache-server:local
    ports:
      - "127.0.0.1:7000:7000"   # client
      - "127.0.0.1:7001:7001"   # peer (프로토콜 미구현, PING만 응답)
    expose:
      - "9091"
    stop_grace_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # 로컬 확인용 익명 읽기 전용 접근. 계정 정보는 저장소에 두지 않는다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
