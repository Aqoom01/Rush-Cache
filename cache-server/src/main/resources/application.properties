# 로컬 개발용 기본 설정. 실행 시 경로를 인자로 주면 그 파일을 대신 쓴다.
node.id=1
cluster.id=openkache-local
# client·peer listener bind 주소. 외부 접속이 필요할 때만 0.0.0.0으로 바꾼다.
bind.host=127.0.0.1
# /metrics bind 주소. 기본은 로컬에서만 접근할 수 있다.
admin.host=127.0.0.1
client.port=7000
peer.port=7001
admin.port=9091
workers=2
request.timeout.ms=2000
