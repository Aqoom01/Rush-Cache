# 저장소 루트에서 build와 Runner installDist를 마친 뒤 공통 Runner에 이 config를 전달한다.
execution.mode=research
study=b3-live-migration
experiment=b3-stop-and-copy
# repository.root는 이 config 파일의 폴더 기준이다.
repository.root=../../..
backend.option.profile=full
backend.main=io.openkache.core.migration.experiment.BaselineResearchMain
backend.classpath=cache-core/build/classes/java/main,cache-core/build/classes/java/test
backend.source.paths=cache-core/src/main,cache-core/src/test/java/io/openkache/core/migration/experiment
backend.build.receipt=cache-core/build/research-build/b3-baseline.properties
backend.result.schema=b3-baseline-json-1
backend.expected.cases=130
backend.jvm.arg.1=-Xmx2g
backend.arg.1={output.dir}
backend.arg.2={config.backend.option.profile}
backend.arg.3={repeat}
backend.arg.4={repeat.count}
repeat.count=1
run.timeout.ms=600000
execution.timeout.ms=3600000
# results.dir는 저장소 루트 기준. 매 실행 새 suite 폴더를 만든다.
results.dir=experiments/b3-live-migration/migration-comparison/runs
