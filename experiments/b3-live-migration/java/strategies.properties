# 설정 검증용 예제. 이 파일을 읽는 것만으로 실험·서버를 실행하지 않는다.
scenario.flow=N
strategy.scaler=elastman
strategy.planner=fixed-tablet-lpt
strategy.scheduler=mongodb
strategy.copy=pre-copy
strategy.drain=preflight-all

capability.replicas=false
capability.split.merge=false
capability.native.hints=false

scaling.initial.nodes=4
scaling.min.nodes=4
scaling.max.nodes=6
scheduler.concurrent.jobs=4
scheduler.jobs.per.node=4
scheduler.cluster.bytes.per.tick=16384
scheduler.node.bytes.per.tick=4096
scheduler.max.job.ticks=10000
copy.batch.bytes=4096
copy.dirty.threshold.bytes=1024
copy.max.live.rounds=10
