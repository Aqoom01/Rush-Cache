# 단일 노드 baseline: cache-server 1대의 처리량·지연(p50/p99)을 잰다(인메모리 결과).
# TCP 실험 공통 형식이라 아래 키만 쓴다. 연구별 변수는 research 형식을 쓴다.
# 실행 방법은 experiments/README.md(로컬), infra/README.md §10(CI).

# 요청 대상
target.host=127.0.0.1
target.port=7000

# 이름표(결과에 기록). 같은 seed면 같은 요청열이 나온다.
study=baseline-single-node
variant=uniform-70-20-10
scenario=none
seed=42

# 데이터: key 개수, key·value 크기(byte)
key.count=1000
key.length=16
value.size=64

# 요청: 연산 비율(합 100), key 분포(UNIFORM 또는 FIXED_HOT_KEY + hot.key.fraction), 동시 클라이언트 수
mix.get=70
mix.set=20
mix.delete=10
distribution=UNIFORM
concurrency=4

# 양: 예열(측정 제외) 후 측정할 요청 수, 요청 하나의 timeout
warmup.requests=2000
measured.requests=20000
request.timeout.ms=2000

# 반복 횟수, 1회 제한, 전체 제한(최대 1시간, CI 자동 정지 시각의 기준)
repeat.count=1
run.timeout.ms=600000
execution.timeout.ms=3600000

# 결과 폴더(JSON 원본 + summary.csv), 서버 worker 수 메모(측정값 아님)
results.dir=experiments/baseline-single-node/results
server.workers.hint=2
