# 단일 노드 baseline 실험. cache-server를 기본 설정(application.properties)으로 먼저 띄운 뒤 실행한다.
#
#   ./gradlew :cache-server:installDist :experiment-runner:installDist
#   cache-server/build/install/openkache-server/bin/openkache-server &
#   experiment-runner/build/install/openkache-experiment-runner/bin/openkache-experiment-runner \
#       experiments/baseline-single-node/config.properties
#
# 같은 설정 파일과 seed로 다시 실행하면 같은 요청열이 재현된다(core.kv.KvEngine은 단일 노드·인메모리이므로
# 이 결과를 SSD나 분산 환경의 성능으로 해석하지 않는다).
target.host=127.0.0.1
target.port=7000
study=baseline-single-node
variant=uniform-70-20-10
scenario=none
seed=42
key.count=1000
key.length=16
value.size=64
mix.get=70
mix.set=20
mix.delete=10
distribution=UNIFORM
concurrency=4
warmup.requests=2000
measured.requests=20000
request.timeout.ms=2000
results.dir=experiments/baseline-single-node/results
# 서버를 띄울 때 쓴 workers 값을 적어 둔다(Runner가 직접 측정하지 않는다). 기본 application.properties는 2.
server.workers.hint=2
