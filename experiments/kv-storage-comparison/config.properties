# KV 저장소 비교: 같은 부하를 memory·nvme 저장소에서 돌려 SSD 읽기가 지연·처리량에 주는 영향을 잰다.
# 같은 config를 CI STORAGE=memory, STORAGE=nvme로 한 번씩 실행한다(NODES=1). 설명은 같은 폴더의 README.md.

# 요청 대상(CI가 cache-server 1번 노드 주소로 바꾼다)
target.host=127.0.0.1
target.port=7000

# 이름표. 저장소 종류는 결과의 storageLayer와 S3 폴더 이름에 남는다.
study=kv-storage-comparison
variant=uniform-1kib-200k
scenario=none
seed=42

# 데이터: key 20만 개 x value 1KiB = 약 200MB. memory 저장소도 heap(2GiB)에 담을 수 있는 크기다.
key.count=200000
key.length=16
value.size=1024

# 요청: GET 80 / SET 20. DELETE를 빼서 key가 계속 채워지게 한다(측정 끝 무렵 약 86%가 존재).
mix.get=80
mix.set=20
mix.delete=0
distribution=UNIFORM
concurrency=8

# 양: 예열 100만 건이 key의 약 63%를 채운 뒤 100만 건을 잰다(1회 약 7분).
warmup.requests=1000000
measured.requests=1000000
request.timeout.ms=2000

# 반복 3회. 서버는 반복 사이에 비우지 않으므로 2·3회차는 더 많이 채워진 상태에서 시작한다.
repeat.count=3
run.timeout.ms=900000
execution.timeout.ms=1800000

# 결과 폴더(CI는 노드 안 경로로 바꾼다), 서버 worker 수 메모
results.dir=experiments/kv-storage-comparison/results
server.workers.hint=2
