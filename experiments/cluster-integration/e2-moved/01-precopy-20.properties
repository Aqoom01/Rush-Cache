# E2 sequential pre-copy migrations during open-loop load
deploy.server=b1
deploy.members=8
deploy.b1.tablets.per.node=4

target.host=127.0.0.1
target.port=7000
study=cluster-e2-moved
variant=precopy-20
scenario=moved-and-table-propagation
seed=42
key.count=1000000
key.length=16
value.size=1024
mix.get=40
mix.set=30
mix.delete=30
distribution=zipf
zipf.exponent=0.99
request.timeout.ms=2000
results.dir=results
concurrency=64
warmup.requests=20000
measured.requests=300000
run.timeout.ms=480000
execution.timeout.ms=480000

cluster.mode=b1
load.rate=5000
redirect.max=3
consistency.check=true
migration.method=pre-copy
migration.rate.bytes.per.sec=0
migration.batch.bytes=65536
migration.stop.threshold.bytes=262144
migration.max.rounds=10
migration.at.ms=3000,5000,7000,9000,11000,13000,15000,17000,19000,21000,23000,25000,27000,29000,31000,33000,35000,37000,39000,41000
migration.tablet=0,4,8,12,16,20,24,28,1,5,9,13,17,21,25,29,2,6,10,14
migration.to=1,2,3,4,5,6,7,0,3,4,5,6,7,0,1,2,5,6,7,0
