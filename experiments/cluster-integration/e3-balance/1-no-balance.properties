# B1+B2+B3 통합 균형 조정 (이 폴더 README.md)
deploy.server=b1
deploy.members=2
deploy.b1.tablets.per.node=2

target.host=127.0.0.1
target.port=7000
study=cluster-e3-balance
variant=no-balance
scenario=hot-range
seed=42
key.count=1000000
key.length=16
value.size=1024
mix.get=40
mix.set=30
mix.delete=30
# 해시가 작은 key 10%(Tablet 0, node 0)에 요청 90%가 몰린다
distribution=hot_range
hot.range.key.fraction=0.1
hot.range.request.fraction=0.9
concurrency=64
warmup.requests=20000
measured.requests=600000
request.timeout.ms=2000
run.timeout.ms=1500000
execution.timeout.ms=1500000
results.dir=results

cluster.mode=b1
load.rate=5000
retry.busy.max=100000
retry.busy.interval.ms=1
retry.busy.max.interval.ms=20
