# E1 static direct routing, closed-loop
deploy.server=b1
deploy.members=1
deploy.b1.tablets.per.node=4

target.host=127.0.0.1
target.port=7000
study=cluster-e1-routing
variant=b1-n1-c64
scenario=routing-overhead
seed=42
key.count=1000000
key.length=16
value.size=1024
mix.get=40
mix.set=30
mix.delete=30
distribution=zipf
zipf.exponent=0.99
request.timeout.ms=2000
results.dir=results
concurrency=64
warmup.requests=100000
measured.requests=200000
run.timeout.ms=240000
execution.timeout.ms=240000
