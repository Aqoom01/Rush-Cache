# E4 이동 방식 비교 (experiments/cluster-integration/design.md §4 E4, 이 폴더 README.md)
deploy.server=b1
deploy.members=2
deploy.b1.tablets.per.node=2

target.host=127.0.0.1
target.port=7000
study=cluster-e4
variant=stop-and-copy-write-low
scenario=hot-tablet-move
seed=42
key.count=1000000
key.length=16
value.size=1024
mix.get=80
mix.set=10
mix.delete=10
distribution=zipf
zipf.exponent=0.99
concurrency=64
warmup.requests=20000
measured.requests=300000
request.timeout.ms=2000
run.timeout.ms=1200000
execution.timeout.ms=1200000
results.dir=results

cluster.mode=b1
load.rate=5000
retry.busy.max=100000
retry.busy.interval.ms=1
retry.busy.max.interval.ms=20
# seed 42·Zipf 0.99·2노드×2 Tablet에서 요청이 가장 많은 Tablet 3(node 1, 약 31%)을 node 0으로 옮긴다
migration.at.ms=10000
migration.tablet=3
migration.to=0
migration.method=stop-and-copy
migration.rate.bytes.per.sec=0
migration.batch.bytes=65536
migration.stop.threshold.bytes=262144
migration.max.rounds=10
