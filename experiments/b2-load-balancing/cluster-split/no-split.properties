# ClusterSplitPlanner가 만든 파일. 직접 고치지 말고 기준 config를 고친 뒤 다시 만든다.
# B2 클러스터 분할 실험의 기준 config. 직접 실행하지 않고 ClusterSplitPlanner로 정책별 config 3개를 만든다(README.md).
# cache-server 2대에서 해시 구간 하나에 몰린 부하를 midpoint·split-for-heat로 나눴을 때 노드별 부하·지연을 잰다.

# 요청 대상. 생성된 config의 target.hosts가 이 값을 대신한다(CI는 노드 주소로 바꾼다).
target.host=127.0.0.1
target.port=7000

study=b2-cluster-split
scenario=hot-range-20-80
seed=42

# 데이터: key 10만 개 x value 1KiB = 약 100MB. nvme 저장소에서는 GET hit가 SSD 읽기가 된다.
key.count=100000
key.length=16
value.size=1024

# 요청: 해시값이 작은 쪽 key 20%에 요청 80%(split-comparison의 S2와 같은 모양). SET 30%로 key를 빨리 채운다.
mix.get=70
mix.set=30
mix.delete=0
distribution=HOT_RANGE
hot.range.key.fraction=0.2
hot.range.request.fraction=0.8
# 1 vCPU 서버를 포화시키도록 동시성을 높인다. 부하 생성 노드가 먼저 포화되는지는 no-split 처리량으로 확인한다.
concurrency=16

# 양: 예열 40만 건(관찰 window 크기이기도 하다) 후 60만 건 측정, 반복 2회
warmup.requests=400000
measured.requests=600000
request.timeout.ms=2000
repeat.count=2
run.timeout.ms=600000
execution.timeout.ms=900000

results.dir=experiments/b2-load-balancing/cluster-split/results
server.workers.hint=2
variant=no-split
target.hosts=127.0.0.1:7000,127.0.0.1:7010
