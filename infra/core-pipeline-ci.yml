# The 4 pilot + 155 core cases advance using verified result artifacts only.
.core-cloud:
  extends: .integration-cloud-base
  allow_failure: true
  variables:
    INTEGRATION_PLAN_ARGS: '[]'
    INTEGRATION_SLICE: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true" && $EXPERIMENT_SUITE == "integrated-core"

.core-analyze:
  tags: [openstd-aws]
  image: python:3.12-alpine
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true" && $EXPERIMENT_SUITE == "integrated-core"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [core-plan/]

core-pilot:
  extends: .core-cloud
  stage: core-pilot
  needs: [integration-package]
  variables:
    CORE_PHASE: pilot
    INTEGRATION_MATRIX: core-plan/pilot.csv
    INTEGRATION_PLAN_SPEC: core-plan/pilot.json

core-calibrate:
  extends: .core-analyze
  stage: core-calibrate
  needs: [integration-package, core-pilot]
  script:
    - python3 experiments/system-integration/ec2/core_pipeline.py calibrate

core-screen:
  extends: .core-cloud
  stage: core-screen
  needs: [integration-package, core-calibrate]
  parallel:
    matrix:
      - INTEGRATION_SLICE: ["0", "12", "24", "36", "48", "60"]
  variables:
    CORE_PHASE: screen
    INTEGRATION_MATRIX: core-plan/screen.csv
    INTEGRATION_PLAN_SPEC: core-plan/screen.json

core-select:
  extends: .core-analyze
  stage: core-select
  needs: [core-calibrate, core-screen]
  script:
    - python3 experiments/system-integration/ec2/core_pipeline.py select

core-working-set:
  extends: .core-cloud
  stage: core-working-set
  needs: [integration-package, core-select]
  parallel:
    matrix:
      - INTEGRATION_SLICE: ["0", "12"]
  variables:
    CORE_PHASE: working-set
    INTEGRATION_MATRIX: core-plan/working-set.csv
    INTEGRATION_PLAN_SPEC: core-plan/working-set.json

core-make-followups:
  extends: .core-analyze
  stage: core-followups
  needs: [core-select, core-working-set]
  script:
    - python3 experiments/system-integration/ec2/core_pipeline.py followups

core-balance:
  extends: .core-cloud
  stage: core-balance
  needs: [integration-package, core-make-followups]
  parallel:
    matrix:
      - INTEGRATION_SLICE: ["0", "12"]
  variables:
    CORE_PHASE: balance
    INTEGRATION_MATRIX: core-plan/balance.csv
    INTEGRATION_PLAN_SPEC: core-plan/balance.json

core-copy:
  extends: .core-cloud
  stage: core-copy
  needs: [integration-package, core-make-followups, core-balance]
  variables:
    CORE_PHASE: copy
    INTEGRATION_MATRIX: core-plan/copy.csv
    INTEGRATION_PLAN_SPEC: core-plan/copy.json

core-failure:
  extends: .core-cloud
  stage: core-failure
  needs: [integration-package, core-make-followups, core-copy]
  parallel:
    matrix:
      - INTEGRATION_SLICE: ["0", "12"]
  variables:
    CORE_PHASE: failure
    INTEGRATION_MATRIX: core-plan/failure.csv
    INTEGRATION_PLAN_SPEC: core-plan/failure.json

core-pick-final:
  extends: .core-analyze
  stage: core-final-select
  needs: [core-make-followups, core-balance, core-copy, core-failure]
  script:
    - python3 experiments/system-integration/ec2/core_pipeline.py finalize-selection

core-final:
  extends: .core-cloud
  stage: core-final
  needs: [integration-package, core-pick-final]
  parallel:
    matrix:
      - INTEGRATION_SLICE: ["0", "12"]
  variables:
    CORE_PHASE: final
    INTEGRATION_MATRIX: core-plan/final.csv
    INTEGRATION_PLAN_SPEC: core-plan/final.json

core-report:
  extends: .core-analyze
  stage: core-report
  when: always
  needs: [core-pick-final, core-pilot, core-screen, core-working-set, core-balance, core-copy, core-failure, core-final]
  before_script:
    - apk add --no-cache aws-cli > /dev/null
  script:
    - python3 experiments/system-integration/ec2/core_pipeline.py report --upload-report
