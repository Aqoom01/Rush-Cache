# External SSAFY GitLab runner is the durable coordinator, not the user's laptop.
integration-package:
  stage: prepare
  tags: [openstd-aws]
  image: eclipse-temurin:21-jdk-alpine
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true" && ($EXPERIMENT_SUITE == "integrated" || $EXPERIMENT_SUITE == "integrated-core")
  before_script:
    - apk add --no-cache bash python3 git > /dev/null
  script:
    - python3 experiments/system-integration/ec2/test_cloud_archive.py
    - python3 experiments/system-integration/ec2/test_core_focus.py
    - python3 experiments/system-integration/ec2/test_integration.py
    - python3 infra/scripts/test_integration_cloud.py
    - python3 infra/scripts/test_integration_diagnose.py
    - python3 experiments/system-integration/ec2/test_core_pipeline.py
    - python3 experiments/system-integration/ec2/core_pipeline.py prepare --plan core-plan
    - |
      python3 - <<'PY'
      import csv, os, sys
      from pathlib import Path
      sys.path.insert(0, 'experiments/system-integration/ec2')
      from integration import row_plan_arguments
      path = Path('core-plan/pilot.csv' if os.environ['EXPERIMENT_SUITE'] == 'integrated-core' else os.environ['INTEGRATION_MATRIX']).resolve()
      assert path.suffix == '.csv' and path.is_relative_to(Path.cwd()), 'CSV must be inside the checkout'
      with path.open(newline='') as stream:
          rows = list(csv.DictReader(stream))
      assert 1 <= len(rows) <= 156, 'CSV must have 1..156 cases'
      for row in rows: row_plan_arguments(row)
      PY
    - ./gradlew :cache-server:integrationZip --console=plain
  artifacts:
    expire_in: 7 days
    paths:
      - cache-server/build/distributions/openkache-integration.zip
      - core-plan/

.integration-cloud-base:
  stage: experiment
  tags: [openstd-aws]
  image:
    name: hashicorp/terraform:1.17.1
    entrypoint: [""]
  needs: [integration-package]
  resource_group: aws-experiment
  interruptible: false
  timeout: 180m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 160m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 15m
  before_script:
    - apk add --no-cache bash coreutils aws-cli python3 git > /dev/null
  script:
    - |
      if ! python3 - <<'PY'
      import csv, os
      with open(os.environ['INTEGRATION_MATRIX'], newline='') as stream:
          rows = list(csv.DictReader(stream))
      raise SystemExit(0 if int(os.environ['INTEGRATION_SLICE']) < len(rows) else 1)
      PY
      then
        echo "이 구간은 입력 행이 없어 AWS 호출 없이 종료합니다."
        exit 0
      fi
    - |
      python3 infra/scripts/integration_cloud.py \
        --campaign "ci-${CI_PIPELINE_ID}" --batch "ci-${CI_PIPELINE_ID}-${CI_JOB_ID}" \
        --account "$TF_VAR_account_id" --commit "$CI_COMMIT_SHA" \
        --bundle cache-server/build/distributions/openkache-integration.zip \
        --matrix "$INTEGRATION_MATRIX" --start "$INTEGRATION_SLICE" --limit 12 \
        --plan-args-json "$INTEGRATION_PLAN_ARGS" --plan-spec "${INTEGRATION_PLAN_SPEC:-}" \
        --phase "${CORE_PHASE:-manual}" --work "cloud-state/${CI_JOB_ID}" --execute
  # A failed upload must never take the legacy unconditional destroy path.
  after_script:
    - |
      if [ -f "cloud-state/${CI_JOB_ID}/execution-started.json" ] && [ ! -f "cloud-state/${CI_JOB_ID}/cleanup-complete.json" ]; then
        python3 infra/scripts/integration_cloud.py \
          --campaign "ci-${CI_PIPELINE_ID}" --batch "ci-${CI_PIPELINE_ID}-${CI_JOB_ID}" \
          --account "$TF_VAR_account_id" --commit "$CI_COMMIT_SHA" \
          --bundle cache-server/build/distributions/openkache-integration.zip \
          --matrix "$INTEGRATION_MATRIX" --phase "${CORE_PHASE:-manual}" --work "cloud-state/${CI_JOB_ID}" --finalize-only --execute
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - cloud-state/*/*.json

integration-cloud-batch:
  extends: .integration-cloud-base
  parallel:
    matrix:
      - INTEGRATION_SLICE: ["0", "12", "24", "36", "48", "60", "72", "84", "96", "108", "120", "132", "144"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true" && $EXPERIMENT_SUITE == "integrated"

integration-backup-diagnostics:
  stage: experiment
  tags: [openstd-aws]
  image: python:3.12-alpine
  resource_group: aws-experiment
  interruptible: false
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true" && $EXPERIMENT_SUITE == "integrated-diagnose"
  before_script:
    - apk add --no-cache aws-cli > /dev/null
  script:
    - python3 infra/scripts/test_integration_diagnose.py
    - |
      python3 infra/scripts/integration_diagnose.py \
        --source-pipeline "$INTEGRATION_SOURCE_PIPELINE" --source-job "$INTEGRATION_SOURCE_JOB" \
        --account "$TF_VAR_account_id" --work "cloud-diagnostics/${CI_JOB_ID}" --execute
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - cloud-diagnostics/*/*.json
